<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คืนหมาป่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#10152b; --surface:#19203f; --surface-2:#222b52; --line:#2f3a6a;
  --fg:#e9ecf7; --muted:#9ba5cb; --accent:#a9c1ff; --on-accent:#0e1330;
  --danger:#ff8080; --good:#7ddba3; --moon:#e8edff;
  --f-display:'Mitr','Thonburi','Tahoma',sans-serif;
  --f-body:'Sarabun','Thonburi','Tahoma',sans-serif;
  color-scheme:dark;
}
:root[data-phase="day"]{
  --bg:#e2ecf5; --surface:#ffffff; --surface-2:#eef3f9; --line:#c3d1e3;
  --fg:#18223f; --muted:#56628a; --accent:#2a4fcf; --on-accent:#ffffff;
  --danger:#c42f33; --good:#14744a; --moon:#e8a21a;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--f-body);
  padding-block:12px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .6s,color .6s;
}
h1,h2{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.3rem}
h2{font-size:1.1rem}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.emb{flex:none;display:block}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.codechip{font:600 1.05rem var(--f-display);letter-spacing:.28em;padding:6px 10px 6px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.panel.quiet{background:transparent}
label{font-weight:600;font-size:.92rem}
input{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input#cd{text-transform:uppercase;letter-spacing:.3em;font-family:var(--f-display)}
.btn{font:600 1rem var(--f-body);background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:10px;padding:11px 16px;cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input:focus-visible,.btn:focus-visible,.pick:focus-visible,.role:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.88rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:.92rem}
.warn{border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:.88rem}
.note{color:var(--muted);font-size:.92rem}
.big{font:600 2.6rem/1 var(--f-display);letter-spacing:.3em;text-align:center;padding:10px 0 10px .3em}
.phase{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.phase strong{font:500 1.4rem var(--f-display)}
.role{display:grid;gap:2px;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;width:100%}
.role.open{border-style:solid}
.role .rn{font:500 1.5rem var(--f-display)}
.role .hint{font-size:.82rem;color:var(--muted)}
.r-wolf{color:var(--danger)} .r-seer{color:var(--accent)} .r-doctor{color:var(--good)} .r-villager{color:var(--muted)}
.picks{display:grid;gap:8px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;font:inherit;font-weight:500;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;min-height:46px;text-align:left}
.pick.on{box-shadow:inset 0 0 0 2px var(--accent)}
.pick .tick{font-size:.82rem;color:var(--accent)}
.pls{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--surface-2);min-width:0}
.pl .nm{overflow-wrap:anywhere;min-width:0}
.pl.dead .nm{text-decoration:line-through;color:var(--muted)}
.pl .st{font-size:.82rem;color:var(--muted);white-space:nowrap}
.chip{display:inline-block;padding:0 8px;border:1px solid currentColor;border-radius:99px;font-size:.78rem;line-height:1.6;margin-left:6px;white-space:nowrap}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.95rem}
.log li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.log b{font-weight:600;color:var(--muted);font-size:.82rem;padding-top:2px;white-space:nowrap}
.verdict{font:500 1.5rem/1.35 var(--f-display);text-wrap:balance}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
var $app=document.getElementById('app');
var ROLE={
  wolf:{n:'หมาป่า',d:'ทุกคืนเลือกชาวบ้านที่จะกำจัด กลางวันต้องแกล้งเป็นชาวบ้านเพื่อไม่ให้ถูกโหวต'},
  villager:{n:'ชาวบ้าน',d:'ไม่มีความสามารถพิเศษ ใช้การสังเกตและพูดคุยหาตัวหมาป่า แล้วโหวตประหาร'},
  seer:{n:'ผู้หยั่งรู้',d:'ทุกคืนเลือกส่องหนึ่งคน ตอนเช้าจะรู้ว่าคนนั้นเป็นหมาป่าหรือไม่'},
  doctor:{n:'หมอ',d:'ทุกคืนเลือกปกป้องหนึ่งคน ถ้าหมาป่าเลือกคนนั้นพอดี เขาจะไม่ตาย ปกป้องตัวเองได้'}
};
var PH={lobby:'ห้องรอ',night:'กลางคืน',day:'กลางวัน',vote:'โหวตประหาร',end:'จบเกม'};
function dist(n){var w=n>=12?3:n>=8?2:1,s=n>=5?1:0,d=n>=6?1:0;return {w:w,s:s,d:d,v:n-w-s-d}}

var token='';
try{token=localStorage.getItem('ww:token')||''}catch(e){}
if(token.length<8){
  var a=new Uint8Array(16);(window.crypto||{getRandomValues:function(x){for(var i=0;i<x.length;i++)x[i]=Math.random()*256}}).getRandomValues(a);
  token=Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
  try{localStorage.setItem('ww:token',token)}catch(e){}
}
var ws=null,retry=0,retryTimer=null,savedCode='';
try{savedCode=localStorage.getItem('ww:room')||''}catch(e){}
var ui={state:'boot',name:'',joinCode:'',err:'',busy:false,online:false,revealFor:'',copied:'',v:null};
try{ui.name=localStorage.getItem('ww:name')||''}catch(e){}
(function(){var h='';try{h=(location.hash||'').slice(1).toUpperCase()}catch(e){}if(/^[A-Z]{4}$/.test(h))ui.joinCode=h})();

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pl(id){var v=ui.v;return v&&v.players.find(function(p){return p.id===id})}
function nameOf(id){var p=pl(id);return p?p.name:'ผู้เล่น'}
function saveRoom(c){savedCode=c||'';try{if(c)localStorage.setItem('ww:room',c);else localStorage.removeItem('ww:room')}catch(e){}}

/* ---------- connection ---------- */
function send(o){if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function connect(){
  clearTimeout(retryTimer);
  var proto=location.protocol==='https:'?'wss:':'ws:';
  try{ws=new WebSocket(proto+'//'+location.host)}catch(e){scheduleRetry();return}
  ws.onopen=function(){
    retry=0;ui.online=true;
    if(savedCode)send({t:'resume',token:token,code:savedCode});
    else if(ui.state==='boot'){ui.state='entry'}
    render();
  };
  ws.onmessage=function(ev){
    var m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.t==='state'){
      ui.v=m.v;ui.state='room';ui.err='';ui.busy=false;
      saveRoom(m.v.code);
      try{localStorage.setItem('ww:name',nameOf(m.v.me.id))}catch(e){}
      try{if(location.hash!=='#'+m.v.code)history.replaceState(null,'','#'+m.v.code)}catch(e){}
    }else if(m.t==='err'){ui.err=m.m||'เกิดข้อผิดพลาด';ui.busy=false;if(ui.state==='boot')ui.state='entry'}
    else if(m.t==='gone'){ui.v=null;saveRoom('');ui.state='entry';ui.busy=false;ui.err=m.m||'';try{history.replaceState(null,'','#')}catch(e){}}
    render();
  };
  ws.onclose=function(){ui.online=false;ui.busy=false;render();scheduleRetry()};
  ws.onerror=function(){};
}
function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer=setTimeout(connect,Math.min(1000*Math.pow(1.6,retry++),8000));
}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&(!ws||ws.readyState>1)){retry=0;connect()}
});

/* ---------- ui pieces ---------- */
function emblem(day){
  if(day){
    var g='';
    for(var i=0;i<8;i++){var a=i*Math.PI/4;g+='<line x1="'+(16+10*Math.cos(a)).toFixed(2)+'" y1="'+(16+10*Math.sin(a)).toFixed(2)+'" x2="'+(16+13.5*Math.cos(a)).toFixed(2)+'" y2="'+(16+13.5*Math.sin(a)).toFixed(2)+'"/>'}
    return '<svg class="emb" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><circle cx="16" cy="16" r="6.5" fill="var(--moon)"/><g stroke="var(--moon)" stroke-width="2" stroke-linecap="round" fill="none">'+g+'</g></svg>';
  }
  return '<svg class="emb" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><circle cx="15" cy="16" r="11" fill="var(--moon)"/><circle cx="21" cy="12" r="9.5" fill="var(--bg)"/></svg>';
}
function header(day,room){
  return '<header class="top"><div class="brand">'+emblem(day)+'<div><div class="eyebrow">เกมหมาป่า</div><h1>คืนหมาป่า</h1></div></div>'+
    (room?'<div class="codechip" aria-label="รหัสห้อง">'+esc(room)+'</div>':'')+'</header>';
}
function banner(){
  var s='';
  if(!ui.online)s+='<div class="warn" role="status">ขาดการเชื่อมต่อ กำลังต่อใหม่…</div>';
  if(ui.err)s+='<div class="err" role="alert">'+esc(ui.err)+'</div>';
  return s;
}
function picks(ids,cur){
  return '<div class="picks">'+ids.map(function(id){
    var on=cur===id;
    return '<button class="pick'+(on?' on':'')+'" data-act="pick" data-id="'+esc(id)+'" aria-pressed="'+on+'"><span>'+esc(nameOf(id))+'</span><span class="tick">'+(on?'เลือกแล้ว':'')+'</span></button>';
  }).join('')+'</div>';
}
function distTable(){
  var rows=[4,5,6,8,12,16].map(function(n){var d=dist(n);return '<tr><td>'+n+' คน</td><td>'+d.w+'</td><td>'+d.s+'</td><td>'+d.d+'</td><td>'+d.v+'</td></tr>'}).join('');
  return '<div class="scroll"><table><thead><tr><th>จำนวนผู้เล่น</th><th>หมาป่า</th><th>ผู้หยั่งรู้</th><th>หมอ</th><th>ชาวบ้าน</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- screens ---------- */
function renderEntry(){
  return header(false,'')+banner()+
  '<section class="panel"><h2>เริ่มเล่นกับเพื่อน</h2>'+
    '<label for="nm">ชื่อเล่นของคุณ</label><input id="nm" maxlength="16" autocomplete="off" value="'+esc(ui.name)+'">'+
    '<button class="btn" data-act="create"'+(!ui.online||ui.busy?' disabled':'')+'>สร้างห้องใหม่</button>'+
    '<div class="or"><span>หรือเข้าห้องของเพื่อน</span></div>'+
    '<label for="cd">รหัสห้อง 4 ตัวอักษร</label><input id="cd" maxlength="4" autocomplete="off" placeholder="ABCD" value="'+esc(ui.joinCode)+'">'+
    '<button class="btn ghost" data-act="join"'+(!ui.online||ui.busy?' disabled':'')+'>เข้าห้อง</button>'+
  '</section>'+
  '<section class="panel quiet"><h2>แจกบทบาทอัตโนมัติ</h2><p class="note">เล่นได้ 4 ถึง 16 คน ระบบสุ่มบทบาทให้ตามจำนวนคน ไม่มีใครเห็นบทบาทของคนอื่น</p>'+distTable()+'</section>';
}
function renderLobby(v){
  var n=v.players.length,d=v.dist,isHost=v.me.isHost;
  var list=v.players.map(function(p){
    return '<li class="pl"><span class="nm">'+esc(p.name)+(p.id===v.me.id?'<span class="chip">คุณ</span>':'')+(p.isHost?'<span class="chip">โฮสต์</span>':'')+'</span><span class="st">'+(p.connected?'':'หลุดการเชื่อมต่อ')+'</span></li>';
  }).join('');
  var host=v.players.find(function(p){return p.isHost});
  return header(false,v.code)+banner()+
  '<section class="panel"><div class="eyebrow">รหัสห้อง</div><div class="big">'+esc(v.code)+'</div>'+
    '<p class="note">ส่งลิงก์นี้ให้เพื่อน เปิดแล้วใส่ชื่อก็เข้าห้องได้เลย ไม่ต้องล็อกอิน</p>'+
    '<button class="btn ghost small" data-act="copy">'+(ui.copied==='link'?'คัดลอกลิงก์แล้ว':'คัดลอกลิงก์ชวนเพื่อน')+'</button></section>'+
  '<section class="panel"><h2>ผู้เล่นในห้อง ('+n+')</h2><ul class="pls">'+list+'</ul></section>'+
  '<section class="panel">'+
    (isHost
      ? '<p class="note">'+(n>=4?'ตอนนี้จะได้หมาป่า '+d.w+' · ผู้หยั่งรู้ '+d.s+' · หมอ '+d.d+' · ชาวบ้าน '+d.v:'ต้องมีอย่างน้อย 4 คนถึงเริ่มเกมได้')+'</p><button class="btn" data-act="start"'+(n<4?' disabled':'')+'>เริ่มเกม</button>'
      : '<p class="note">รอโฮสต์'+(host?' ('+esc(host.name)+')':'')+' กดเริ่มเกม</p>')+
    '<button class="btn ghost" data-act="leave">ออกจากห้อง</button></section>';
}
function logPanel(v){
  var items=(v.log||[]).slice().reverse();
  if(!items.length)return '';
  var tag={night:'คืน',vote:'โหวต',info:'เกม'};
  return '<section class="panel"><h2>เหตุการณ์</h2><ol class="log">'+items.map(function(l){
    return '<li><b>รอบ '+l.r+' · '+(tag[l.k]||'')+'</b><span>'+esc(l.t)+'</span></li>';
  }).join('')+'</ol></section>';
}
function playersPanel(v){
  var list=v.players.map(function(p){
    var chip='';
    if(p.role&&(v.phase==='end'||p.id!==v.me.id))chip='<span class="chip r-'+p.role+'">'+ROLE[p.role].n+'</span>';
    var st=!p.inGame?'ผู้ชม':(p.alive?'มีชีวิต':'ตายแล้ว');
    if(!p.connected)st+=' · หลุด';
    return '<li class="pl'+(p.inGame&&!p.alive?' dead':'')+'"><span class="nm">'+esc(p.name)+(p.id===v.me.id?'<span class="chip">คุณ</span>':'')+(p.isHost?'<span class="chip">โฮสต์</span>':'')+chip+'</span><span class="st">'+st+'</span></li>';
  }).join('');
  return '<section class="panel"><h2>ผู้เล่น</h2><ul class="pls">'+list+'</ul></section>';
}
function hostBar(v){
  if(!v.me.isHost||!v.progress)return '';
  if(v.phase==='night')return '<section class="panel quiet"><p class="note">เฉพาะโฮสต์: ส่งภารกิจคืนนี้แล้ว '+v.progress.done+'/'+v.progress.total+' ระบบสรุปให้เองเมื่อครบ</p><button class="btn ghost small" data-act="forceNight">สรุปคืนนี้เลย</button></section>';
  if(v.phase==='vote')return '<section class="panel quiet"><p class="note">เฉพาะโฮสต์: โหวตแล้ว '+v.progress.done+'/'+v.progress.total+' ระบบสรุปให้เองเมื่อครบ</p><button class="btn ghost small" data-act="forceVote">ปิดโหวตตอนนี้</button></section>';
  return '';
}
function aliveOthers(v){return v.players.filter(function(p){return p.inGame&&p.alive&&p.id!==v.me.id}).map(function(p){return p.id})}
function actionPanel(v){
  var role=v.me.role,alive=v.me.alive,cur=v.myAct,ph=v.phase;
  if(!role)return '<section class="panel"><p class="note">คุณเข้ามาหลังเริ่มเกม จึงดูได้อย่างเดียว</p></section>';
  if(ph==='night'){
    if(!alive)return '<section class="panel"><h2>คุณตายแล้ว</h2><p class="note">ดูเกมต่อได้ แต่ห้ามบอกใบ้คนที่ยังเล่นอยู่</p></section>';
    if(role==='wolf'){
      var prey=v.players.filter(function(p){return p.inGame&&p.alive&&p.role!=='wolf'}).map(function(p){return p.id});
      var mates=(v.mates||[]);
      return '<section class="panel"><h2>เลือกเหยื่อคืนนี้</h2>'+
        (mates.length?'<p class="note">เพื่อนหมาป่า: '+mates.map(function(m){return esc(nameOf(m.id))+(m.to?' (เลือก '+esc(nameOf(m.to))+')':' (ยังไม่เลือก)')}).join(', ')+'</p>':'<p class="note">คุณเป็นหมาป่าตัวเดียว</p>')+
        picks(prey,cur)+'<p class="note">เปลี่ยนใจได้จนกว่าทุกคนจะเลือกครบ ถ้าหมาป่าเลือกไม่ตรงกัน ระบบสุ่มจากคนที่ได้คะแนนสูงสุด</p></section>';
    }
    if(role==='seer')return '<section class="panel"><h2>เลือกคนที่จะส่อง</h2>'+picks(aliveOthers(v),cur)+'<p class="note">ตอนเช้าคุณจะรู้ว่าคนนี้เป็นหมาป่าหรือไม่</p></section>';
    if(role==='doctor'){
      var all=v.players.filter(function(p){return p.inGame&&p.alive}).map(function(p){return p.id});
      return '<section class="panel"><h2>เลือกคนที่จะปกป้อง</h2>'+picks(all,cur)+'<p class="note">ปกป้องตัวเองได้</p></section>';
    }
    return '<section class="panel"><h2>กลางคืนแล้ว</h2><p class="note">ชาวบ้านหลับไปก่อน รอทุกคนทำภารกิจ แล้วจะสว่าง</p></section>';
  }
  if(ph==='day'){
    var n=(v.log||[]).slice().reverse().find(function(l){return l.k==='night'&&l.r===v.round});
    var sr=v.seer&&v.seer.r===v.round?v.seer:null;
    return '<section class="panel"><h2>ตอนเช้า</h2>'+(n?'<p class="verdict">'+esc(n.t)+'</p>':'')+
      (sr?'<p>ผลที่คุณส่อง: <b>'+esc(nameOf(sr.to))+'</b> '+(sr.wolf?'<span class="r-wolf">เป็นหมาป่า</span>':'ไม่ใช่หมาป่า')+'</p>':'')+
      '<p class="note">ถึงเวลาคุยกัน โทรหรือพิมพ์ในแชทกลุ่มของพวกคุณได้เลย แล้วให้โฮสต์กดเริ่มโหวตเมื่อพร้อม</p>'+
      (v.me.isHost?'<button class="btn" data-act="toVote">เริ่มโหวตประหาร</button>':'<p class="note">รอโฮสต์เริ่มโหวต</p>')+'</section>';
  }
  if(ph==='vote'){
    if(!alive)return '<section class="panel"><h2>คุณตายแล้ว</h2><p class="note">รอผลโหวตของคนที่ยังเล่นอยู่</p></section>';
    return '<section class="panel"><h2>โหวตประหารหนึ่งคน</h2>'+picks(aliveOthers(v),cur)+'<p class="note">เปลี่ยนโหวตได้จนกว่าทุกคนจะโหวตครบ คะแนนเสมอคือไม่มีใครถูกประหาร</p></section>';
  }
  return '';
}
function renderGame(v){
  var role=v.me.role,out=header(v.phase!=='night',v.code)+banner();
  if(v.phase==='end'){
    out+='<section class="panel"><div class="eyebrow">จบเกม</div><p class="verdict">'+(v.winner==='wolf'?'หมาป่าชนะ เหลือหมาป่าเท่ากับชาวบ้านแล้ว':'ชาวบ้านชนะ กำจัดหมาป่าครบแล้ว')+'</p>'+
      (v.me.isHost?'<button class="btn" data-act="rematch">เล่นอีกรอบกับคนเดิม</button>':'<p class="note">รอโฮสต์เริ่มรอบใหม่</p>')+
      '<button class="btn ghost" data-act="leave">ออกจากห้อง</button></section>';
  }else{
    out+='<section class="phase"><span class="eyebrow">รอบที่ '+v.round+'</span><strong>'+PH[v.phase]+'</strong></section>';
  }
  if(role&&v.phase!=='end'){
    var rev=ui.revealFor===v.game;
    out+='<button class="role'+(rev?' open':'')+'" data-act="reveal" aria-expanded="'+rev+'"><span class="eyebrow">บทบาทของคุณ'+(v.me.alive?'':' (ตายแล้ว)')+'</span>'+
      (rev?'<span class="rn r-'+role+'">'+ROLE[role].n+'</span><span>'+ROLE[role].d+'</span><span class="hint">แตะเพื่อซ่อน</span>'
          :'<span class="rn">แตะเพื่อดู</span><span class="hint">ซ่อนไว้ก่อน กันคนข้างๆ แอบเห็น</span>')+'</button>';
  }
  if(v.phase!=='end')out+=actionPanel(v)+hostBar(v);
  out+=playersPanel(v)+logPanel(v);
  if(v.phase!=='end')out+='<section class="panel quiet"><button class="btn ghost small" data-act="leave">ออกจากห้อง</button></section>';
  return out;
}
function render(){
  var v=ui.v,html,day=false;
  if(ui.state==='room'&&v)day=(v.phase==='day'||v.phase==='vote'||v.phase==='end');
  document.documentElement.setAttribute('data-phase',day?'day':'night');
  if(ui.state==='boot')html=header(false,'')+banner()+'<section class="panel"><p class="note">กำลังเชื่อมต่อ…</p></section>';
  else if(ui.state==='entry'||!v)html=renderEntry();
  else if(v.phase==='lobby')html=renderLobby(v);
  else html=renderGame(v);
  var ae=document.activeElement,keep=ae&&ae.id,pos=null;
  if(keep&&(keep==='nm'||keep==='cd')){try{pos=ae.selectionStart}catch(e){}}
  $app.innerHTML=html;
  if(keep){var el=document.getElementById(keep);if(el){el.focus();if(pos!=null){try{el.setSelectionRange(pos,pos)}catch(e){}}}}
}

/* ---------- events ---------- */
$app.addEventListener('input',function(e){
  if(e.target.id==='nm')ui.name=e.target.value;
  if(e.target.id==='cd'){ui.joinCode=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');e.target.value=ui.joinCode}
});
$app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act'),v=ui.v;
  if(a==='create'){
    var nm=ui.name.trim();if(!nm){ui.err='ใส่ชื่อเล่นก่อน';render();return}
    ui.err='';ui.busy=true;send({t:'create',token:token,name:nm});render();
  }else if(a==='join'){
    var nm2=ui.name.trim();
    if(!nm2){ui.err='ใส่ชื่อเล่นก่อน';render();return}
    if(!/^[A-Z]{4}$/.test(ui.joinCode)){ui.err='รหัสห้องต้องเป็นตัวอักษร 4 ตัว';render();return}
    ui.err='';ui.busy=true;send({t:'join',token:token,name:nm2,code:ui.joinCode});render();
  }else if(a==='leave'){send({t:'leave'})}
  else if(a==='start')send({t:'start'});
  else if(a==='toVote')send({t:'toVote'});
  else if(a==='forceNight')send({t:'forceNight'});
  else if(a==='forceVote')send({t:'forceVote'});
  else if(a==='rematch')send({t:'rematch'});
  else if(a==='pick')send({t:'act',to:b.getAttribute('data-id')});
  else if(a==='reveal'&&v){ui.revealFor=(ui.revealFor===v.game)?'':v.game;render()}
  else if(a==='copy'){
    var url=location.href.split('#')[0]+'#'+(v?v.code:'');
    var done=function(){ui.copied='link';render();setTimeout(function(){ui.copied='';render()},1800)};
    try{navigator.clipboard.writeText(url).then(done,function(){window.prompt&&0})}catch(x){}
  }
});

render();
connect();
})();
</script>
</body>
</html>
